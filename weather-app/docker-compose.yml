services:

  backend:
    image: back-img:v1
    container_name: weather-backend
    ports:
      - "5000:5000"
    restart: unless-stopped

  frontend:
    image: front-img:v1
    container_name: weather-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped:wq
